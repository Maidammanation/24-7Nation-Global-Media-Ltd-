name: Backend validation tests

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "tests/backend/**"
      - "package.json"
      - ".github/workflows/backend-validation-tests.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/backend/**"
      - "package.json"
      - ".github/workflows/backend-validation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run backend validation tests
        run: npm test
