name: Firestore security rules tests

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/firestore-rules/**"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "tests/firestore-rules/**"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/firestore-rules
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore emulator security tests
        run: npx firebase emulators:exec --config ../../firebase.json --project demo-247nation-security --only firestore "npm test"
